<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LiveRig</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button id="power" class="power" aria-label="Audio on or off"><span class="power-dot"></span></button>
    <nav id="rail" class="rail" aria-label="Strips"></nav>
    <button id="masterChip" class="master-chip" aria-label="Master">
      <span class="meter-v"><i id="mL"></i><i id="mR"></i></span>
      <span id="lim" class="lim" hidden>LIM</span>
    </button>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7zm7.4-2.5a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5z"/></svg>
    </button>
  </header>

  <main id="views">
    <section id="view-board" class="view"></section>
    <section id="view-loop" class="view" hidden></section>
    <section id="view-tune" class="view" hidden></section>
    <section id="view-foot" class="view" hidden></section>
  </main>

  <nav class="tabs" id="tabs">
    <button data-tab="board"><svg viewBox="0 0 24 24"><path d="M4 5h16v3H4zM4 10.5h16v3H4zM4 16h16v3H4z"/></svg><span>Board</span></button>
    <button data-tab="loop"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 8 8h-2.5A5.5 5.5 0 1 1 12 6.5V9l4-3.75L12 1.5z"/></svg><span>Loop</span></button>
    <button data-tab="tune"><svg viewBox="0 0 24 24"><path d="M11 3h2v9.3a3.5 3.5 0 1 1-2 0zM5.6 6.4l1.4 1.4A7 7 0 0 0 5 12H3a9 9 0 0 1 2.6-5.6zM18.4 6.4A9 9 0 0 1 21 12h-2a7 7 0 0 0-2-4.2z"/></svg><span>Tune</span></button>
    <button data-tab="foot"><svg viewBox="0 0 24 24"><path d="M3 15h18v4H3zM6 9h4v5H6zM14 7h4v7h-4z"/></svg><span>Foot</span></button>
  </nav>

  <div id="scrim" class="scrim" hidden></div>
  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast" hidden></div>
</div>

<div id="start" class="start">
  <div class="start-card">
    <img src="icon.png" alt="" width="72" height="72">
    <h1>LiveRig</h1>
    <p>Plug your bass or guitar into your phone's interface, then start. The browser will ask to use the microphone: that's your instrument input.</p>
    <button id="startBtn" class="big-btn">Start audio</button>
    <button id="skipBtn" class="btn" style="width:100%">Look around first</button>
    <p class="fine">Use headphones or an interface. A phone's own mic and speaker will feed back.</p>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
